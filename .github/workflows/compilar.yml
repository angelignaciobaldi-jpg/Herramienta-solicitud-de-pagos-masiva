name: Pipeline de Compilación y Empaquetado Automático

# Se dispara al PUBLICAR un Release en GitHub (no en push/merge a main).
# El AutoUpdater de la app lee releases/latest, así que el flujo natural es:
#   crear el Release con su tag (mayor que el anterior) -> publicar.
on:
  release:
    types: [published]

# Permite que el GITHUB_TOKEN automático suba el instalador al Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Sincroniza la versión de la app con el TAG del Release, de forma que el
      # instalador SIEMPRE reporte exactamente su propio tag. Esto evita el bucle
      # de actualización: si version.py quedara por debajo del tag, la app se
      # actualizaría en cada arranque sin avanzar nunca.
      - name: Sincronizar versión con el tag del Release
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $ver = $tag -replace '^v', ''
          Write-Host "Tag del release: $tag  ->  version: $ver"
          (Get-Content core/version.py) `
            -replace '^\s*__version__\s*=.*', "__version__ = `"$ver`"" `
            | Set-Content core/version.py -Encoding utf8
          (Get-Content instalador.iss) `
            -replace '^AppVersion=.*', "AppVersion=$ver" `
            | Set-Content instalador.iss -Encoding utf8
          Write-Host "--- version.py ---"; Get-Content core/version.py | Select-String '__version__'
          Write-Host "--- instalador.iss ---"; Get-Content instalador.iss | Select-String '^AppVersion='

      # El mapa de selectores y las URLs del portal no se versionan (el repo es
      # público). Se reponen desde un secreto para que el .exe los lleve dentro.
      # Sin esto el instalador compilaría, pero la app no sabría hablar con SIPP.
      - name: Reponer los datos de integración con SIPP
        shell: pwsh
        env:
          SIPP_DATOS_JSON: ${{ secrets.SIPP_DATOS_JSON }}
        run: |
          if (-not $env:SIPP_DATOS_JSON) {
            Write-Error "Falta el secreto SIPP_DATOS_JSON. Créalo en Settings > Secrets and variables > Actions con el contenido de datos/sipp.json."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path datos | Out-Null
          $env:SIPP_DATOS_JSON | Out-File -FilePath datos/sipp.json -Encoding utf8
          # Se valida que sea JSON y traiga lo mínimo: un secreto mal pegado
          # produciría un instalador roto que solo falla en el equipo del usuario.
          #
          # Antes de parsear se comprueba que EMPIECE por '{'. El error de
          # ConvertFrom-Json ("Unexpected character ... Path '', line 0") no
          # dice qué se pegó, y el fallo típico no es un JSON roto: es haber
          # pegado otra cosa —el comando que copiaba el archivo, por ejemplo—.
          # NUNCA se imprime el contenido: iría al log de Actions.
          $crudo = (Get-Content datos/sipp.json -Raw)
          if (-not $crudo.TrimStart().StartsWith("{")) {
            $inicio = $crudo.TrimStart()
            $pista = $inicio.Substring(0, [Math]::Min(1, $inicio.Length))
            Write-Error ("El secreto SIPP_DATOS_JSON no contiene un JSON: " +
              "empieza por '$pista' y debería empezar por '{'. Pega el " +
              "CONTENIDO de datos/sipp.json, no la ruta ni el comando que lo lee.")
            exit 1
          }
          $datos = $crudo | ConvertFrom-Json
          if (-not $datos.selectores -or -not $datos.ambientes) {
            Write-Error "datos/sipp.json no trae 'selectores' y 'ambientes'."
            exit 1
          }
          $n = ($datos.selectores | Get-Member -MemberType NoteProperty).Count
          Write-Host "datos/sipp.json repuesto: $n selectores."

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install flet pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      # Smoke test de imports: importa app + todos los modulos de core/ y ui/ para
      # detectar imports rotos o modulos faltantes ANTES de compilar y publicar.
      # Si algo no importa, el build FALLA aqui y el Release roto no llega a nadie.
      - name: Smoke test de imports (falla si algo no importa)
        shell: pwsh
        run: python scripts/smoke_import.py

      # Pruebas de logica (scripts/pruebas/): datos, ingesta, catalogo, asignacion
      # e interfaz. Van despues del smoke de imports porque este es mas barato y
      # caza lo mas grueso primero.
      #
      # Estas SI pueden correr en CI: no abren ventana, no tocan SIPP y usan una
      # base temporal por prueba. Las que leen caratulas generan su propio PDF con
      # capa de texto, asi que tampoco dependen de que Tesseract este instalado
      # —el runner no lo trae—. Lo que NO puede correr aqui es smoke_render.py,
      # que necesita sesion de escritorio para abrir la ventana de verdad; ese
      # sigue siendo manual antes de publicar (ver README).
      - name: Pruebas de logica (falla si alguna no pasa)
        shell: pwsh
        run: python scripts/probar.py

      # 1. Compilar la app con flet pack (onedir). Incluye el driver de Playwright
      #    via --collect-all. NO empaqueta Chromium: se descarga en la 1ra
      #    ejecución del RPA en la PC del usuario. Imagenes sí va (versionada).
      - name: Compilar con flet pack
        shell: pwsh
        run: >
          flet pack app.py -n "SolicitudesPago" -D
          --icon "Imagenes/icon.ico"
          --add-data "Imagenes:Imagenes"
          --add-data "datos:datos"
          --hidden-import openpyxl
          --pyinstaller-build-args=--collect-all=playwright
          -y

      # 2. Instalar Inno Setup y compilar el instalador (instalador.iss).
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compilar Instalador con Inno Setup
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" instalador.iss'

      # 4. Publicar el instalador como asset del Release (nombre exacto que busca
      #    el AutoUpdater: Instalador_SolicitudesPago.exe).
      - name: Subir Instalador al Release de GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: Output/Instalador_SolicitudesPago.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
